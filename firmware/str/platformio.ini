[platformio]
default_envs = e3_nominal

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:e0_replay]
build_src_filter =
    +<e0_main.cpp>
    -<main.cpp>
    -<e1_main.cpp>
    -<e2_main.cpp>
    -<e3a_main.cpp>
    -<e4_main.cpp>
    -<e5_main.cpp>
    -<e5b_main.cpp>
    -<e6_main.cpp>
    -<e7_main.cpp>
    -<e8_main.cpp>
    -<e9_main.cpp>
    -<e10_main.cpp>
build_flags =
    -D STR_E0_REPLAY=1

